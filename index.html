<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Vatan Residence · Telegram</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, system-ui, sans-serif; background: #0f1115; color: #fff; text-align: center; }
  .box { padding: 24px 16px; max-width: 360px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #b8bcc6; font-size: 15px; line-height: 1.45; margin: 0 0 24px; }
  a.btn { display: block; padding: 16px; border-radius: 14px; background: #2aabee; color: #fff;
          font-size: 17px; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<div class="box">
  <h1>Vatan Residence</h1>
  <p>Telegram kanal ochilmoqda…<br>Ochilmasa, pastdagi tugmani bosing.</p>
  <a class="btn" id="go" href="https://t.me/vatan_residence">Telegram kanalga o'tish</a>
</div>
<script>
  // Telegram ilovasini to'g'ridan-to'g'ri ochish; ilova bo'lmasa t.me sahifasiga.
  var app = 'tg://resolve?domain=vatan_residence';
  var web = 'https://t.me/vatan_residence';
  var t = setTimeout(function () { location.replace(web); }, 1500);
  document.addEventListener('visibilitychange', function () { if (document.hidden) clearTimeout(t); });
  location.href = app;
</script>
</body>
</html>
